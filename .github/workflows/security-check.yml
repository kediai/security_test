name: Security Policy Enforcement

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request_target:
    branches:
      - develop

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 🔥 Checkout PR branch safely
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep scan --config=p/security-audit --json > semgrep.json

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

      # 🔥 Professional PR Comment (no duplicate spam)
      - name: Comment PR with findings
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('semgrep.json', 'utf8'));

            let critical = 0;
            let high = 0;
            let other = 0;

            let body = "## 🔒 Security Scan Report\n\n";

            if (!data.results || data.results.length === 0) {
              body += "✅ No security issues found.\n";
            } else {

              data.results.forEach(r => {
                const severity = r.extra?.severity || "INFO";
                const rule = r.check_id;
                const file = r.path;
                const line = r.start?.line;

                if (severity === "ERROR") critical++;
                else if (severity === "WARNING") high++;
                else other++;

                body += `- **${severity}**: ${rule}\n`;
                body += `  📄 ${file}:${line}\n\n`;
              });

              body =
                "## 🔒 Security Scan Summary\n\n" +
                `- 🔴 Critical: ${critical}\n` +
                `- 🟠 High: ${high}\n` +
                `- 🟢 Other: ${other}\n\n` +
                "---\n\n" +
                body;
            }

            // Update existing bot comment if exists
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.data.find(c =>
              c.user.type === "Bot" &&
              c.body.includes("🔒 Security Scan Summary")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }

      - name: Enforce Risk Policy
        run: python enforce_policy.py semgrep.json
